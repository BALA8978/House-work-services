<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - HomeCraft Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100">

    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold text-blue-600">HomeCraft Pro</div>
            <div class="hidden md:flex space-x-6 items-center">
                <a href="index.html" class="text-blue-600 font-semibold">Dashboard</a>
                <a href="../my-bookings/index.html" class="text-gray-600 hover:text-blue-600 transition">My Bookings</a>
                <a href="../Payments/index.html" class="text-gray-600 hover:text-blue-600 transition">Payments</a>
                <a href="../contact/contact.html" class="text-gray-600 hover:text-blue-600 transition">Contact Us</a>
                <a href="../Cprofile/profile.html" class="text-gray-600 hover:text-blue-600 transition">
                    <i class="fas fa-user-circle text-2xl"></i>
                </a>
            </div>
            </nav>
    </header>

    <main class="container mx-auto px-6 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Find a Professional</h1>
            <p class="text-gray-600">Search for the service you need and book a certified technician.</p>
        </div>

        <div class="mb-8">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center">
                    <i class="fas fa-search text-gray-400"></i>
                </span>
                <input type="text" id="search-input" class="w-full pl-10 pr-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Search by name or service (e.g., Plumbing, Electrical)...">
            </div>
        </div>

        <div id="technician-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p class="text-center text-gray-500 col-span-full">Loading available technicians...</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
