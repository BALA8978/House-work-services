<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Job Route - HomeCraft Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='../homepage/index.html'">← Back to Dashboard</button>
            <h1>Live Route Tracking</h1>
        </div>
        <div class="tracking-card">
            <div id="map-container">
                <iframe
                    id="map-frame"
                    width="100%"
                    height="450"
                    style="border:0"
                    loading="lazy"
                    allowfullscreen
                    src="">
                </iframe>
            </div>
            <div class="technician-status">
                <p><strong>Destination:</strong> <span id="customer-details">Loading...</span></p>
                <p><strong>Status:</strong> En route</p>
                <p><strong>Last Updated:</strong> <span id="last-updated">Just now</span></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
